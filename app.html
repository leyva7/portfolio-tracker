<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>My portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f0ea; --surface:#ffffff; --surface-2:#ece8e0; --ink:#1e1c19; --ink-2:#4a453e; --muted:#655f56;
  --line:#e6e1d8; --grid:#eeeae3; --accent:#1f3a68; --accent-ink:#ffffff; --accent-soft:#e4e9f2;
  --gain:#2c7350; --loss:#a9443a; --gain-soft:#e3efe7; --loss-soft:#f5e4e1; --warn:#5e564b; --warn-bg:#ece8e0;
  --gain-fill:#2c7350; --chart-base:#a39c90; --bar:rgba(255,255,255,.86);
  --s1:#1f3a68; --s2:#a39c90; --s3:#6f8dbf; --s4:#b49a6a; --s5:#8a6c58; --s6:#4c6a9c; --s7:#c9c2b6; --s8:#9fb3d6; --s9:#7d776d;
  --div-neg:#a9443a; --div-mid:#ece8e0; --div-pos:#2c7350; --cor-neg:#1f3a68; --cor-pos:#a9443a;
  --f-ui:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(40,32,20,.06),0 4px 16px rgba(40,32,20,.05); --elev:0 1px 2px rgba(40,32,20,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#181715; --surface:#23211e; --surface-2:#2d2b27; --ink:#efebe4; --ink-2:#cfc8bd; --muted:#a9a296;
    --line:#34312c; --grid:#2b2925; --accent:#9db4de; --accent-ink:#14213a; --accent-soft:#2b3240;
    --gain:#86ae95; --loss:#db958a; --gain-soft:#2d2b27; --loss-soft:#2d2b27; --warn:#cfc8bd; --warn-bg:#2d2b27;
    --gain-fill:#7f9cca; --chart-base:#7d776d; --bar:rgba(35,33,30,.88);
    --s1:#9db4de; --s2:#8f887c; --s3:#5f7fb5; --s4:#b59e72; --s5:#a08470; --s6:#7894c4; --s7:#5a554d; --s8:#c3d1ea; --s9:#6e685f;
    --div-neg:#db958a; --div-mid:#2d2b27; --div-pos:#7f9cca; --cor-neg:#9db4de; --cor-pos:#db958a;
    --shadow:0 1px 2px rgba(0,0,0,.3); --elev:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181715; --surface:#23211e; --surface-2:#2d2b27; --ink:#efebe4; --ink-2:#cfc8bd; --muted:#a9a296;
  --line:#34312c; --grid:#2b2925; --accent:#9db4de; --accent-ink:#14213a; --accent-soft:#2b3240;
  --gain:#86ae95; --loss:#db958a; --gain-soft:#2d2b27; --loss-soft:#2d2b27; --warn:#cfc8bd; --warn-bg:#2d2b27;
  --gain-fill:#7f9cca; --chart-base:#7d776d; --bar:rgba(35,33,30,.88);
  --s1:#9db4de; --s2:#8f887c; --s3:#5f7fb5; --s4:#b59e72; --s5:#a08470; --s6:#7894c4; --s7:#5a554d; --s8:#c3d1ea; --s9:#6e685f;
  --div-neg:#db958a; --div-mid:#2d2b27; --div-pos:#7f9cca; --cor-neg:#9db4de; --cor-pos:#db958a;
  --shadow:0 1px 2px rgba(0,0,0,.3); --elev:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:700}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700;font-family:var(--f-ui)}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .small{font-size:13px}
.gain{color:var(--gain)} .loss{color:var(--loss)}
b,strong{font-weight:700}
/* Calma: every gain carries ▲ and every loss ▼, drawn in CSS with the colour of the figure (no glyph, no extra font) */
.gain::before,.loss::before{content:"";display:inline-block;width:0;height:0;border-left:.27em solid transparent;border-right:.27em solid transparent;margin-right:.28em}
.gain::before{border-bottom:.46em solid currentColor;vertical-align:.12em}
.loss::before{border-top:.46em solid currentColor;vertical-align:.1em}
.noarr::before{content:none!important}
/* iPhone v31: the arrow and its figure never part. A signed figure does not wrap; a coloured label that only tints (noarr) wraps as usual */
.gain,.loss{white-space:nowrap}
.gain.noarr,.loss.noarr{white-space:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Top */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:22px 16px}
.brand{display:flex;flex-direction:column;gap:4px}
.hero{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
.hero .val{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.pill.gain{background:var(--gain-soft)} .pill.loss{background:var(--loss-soft)}
.top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.top-actions .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:15px;height:15px}

/* Tabs */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* Simpler nav: Projection and Taxes live inside Analysis (sub-selector); Settings goes to the right */
#tabs [data-tab=taxes],#tabs [data-tab=cash],#tabs [data-tab=transactions]{display:none}
#tabs [data-tab=settings]{margin-left:auto}
.subtabs{align-self:flex-start;max-width:100%}.subtabs button{font-size:13px;padding:6px 14px}
.panel.folded{gap:0}.panel.folded .fold-h{flex-wrap:nowrap}.panel.folded .fold-h>:first-child{min-width:0}.panel.folded>:not(.fold-h){display:none}.panel.folded .fold-h>:not(:first-child):not(.fold-btn){display:none}
.fold-h .fold-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.fold-btn::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s}.fold-btn[aria-expanded="true"]::after{transform:translateY(1px) rotate(-135deg)}
.view{padding-top:18px;display:flex;flex-direction:column;gap:18px}

/* Banners */
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{color:var(--warn)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.info b{color:var(--accent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .l abbr{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}

/* Panels */
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:900px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart{position:relative;height:280px;width:100%}
.chart.sm{height:200px} .chart.xs{height:160px} .chart.donut{height:220px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 9px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:2px;border-radius:1px;vertical-align:3px;width:14px}
.evo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.legend i.dash{height:0;border-top:2px dashed;background:none!important;vertical-align:3px;width:14px}

/* Alloc list */
.alloc{display:flex;flex-direction:column;gap:8px}
.alloc .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px}
.alloc .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.alloc .bar span{display:block;height:100%;border-radius:3px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;flex:none}

/* Tables */
.tbl-wrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:13px;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.asset-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.asset-cell .t{font-weight:700}
.asset-cell .nm{font-size:13px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.alink{all:unset;cursor:pointer;display:block;border-radius:6px}.alink:hover .t,td.fcell:hover{text-decoration:underline}.alink:focus-visible,td.fcell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}td.fcell{cursor:pointer}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.buy{background:var(--accent-soft);color:var(--accent)}
.chip.sell{background:var(--loss-soft);color:var(--loss)}
.chip.inc{background:var(--gain-soft);color:var(--gain)}
.rowact{display:flex;gap:4px;justify-content:flex-end}

/* Stats list */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 24px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid)}
.stat .k{color:var(--ink-2);font-size:13px}
.stat .k small{display:block;color:var(--muted);font-size:13px}
.stat .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;text-align:right}

/* Heatmap */
.heat td,.heat th{text-align:center;padding:6px 4px;font-family:var(--f-num);font-size:13px;border:2px solid var(--surface)}
.heat th{font-family:var(--f-ui)}
.heat td.y{font-weight:700}
.heat td.cell{border-radius:5px;min-width:52px}
.heat td.nd{color:var(--muted);font-size:13px}
.mm-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}.mm-nav select{width:auto;min-width:0}.mm-nav .btn{min-width:34px;justify-content:center}
.mm-bars{display:flex;gap:2px;align-items:stretch;margin-top:6px}.mm-g{flex:1 1 0;min-width:0;border:0;background:none;padding:0 0 2px;border-radius:5px;display:flex;flex-direction:column;gap:3px;color:var(--muted);cursor:pointer}
.mm-g.on{background:var(--surface-2);color:var(--ink)}.mm-g small{font-size:13px;text-align:center;white-space:nowrap;overflow:hidden}
.mm-b{position:relative;height:110px;display:block}.mm-b i{position:absolute;width:34%;border-radius:2px;min-height:1px}.mm-b i.t{left:13%;background:var(--s1)}.mm-b i.k{right:13%;background:var(--s2)}.mm-b .z{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.ay td small,.mmt td small{display:block;color:var(--muted);font-size:13px;font-family:var(--f-ui)}
.mmt tr.tot td,.ay tr.tot td{border-top:2px solid var(--line)}
.idx3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px}
@media (max-width:640px){.mm-g.old{display:none}.mmt .xm{display:none}.idx3{gap:6px}.idx3 .tile{padding:8px 9px}.idx3 .tile .v{font-size:15px}.idx3 .tile .l,.idx3 .tile .s{font-size:13px}.ay td,.ay th{padding-left:5px;padding-right:5px}}
/* display fixes */
.chip{white-space:nowrap}
.pill.flat{color:var(--muted)}
.dim{opacity:.45}
.only-mob,#heroPnl{display:none}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.ls-more{margin-top:8px}
.ls-more>summary{cursor:pointer;font-size:13px;color:var(--muted)}
@media (max-width:640px){
  .only-mob{display:block}
  .toolbar.filters.fhide{display:none}
  .fbar{margin-bottom:4px}
}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.thsort{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.thsort:hover{color:var(--ink)}
.postbl th:first-child,.postbl td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.postbl tbody tr:hover td:first-child{background:var(--surface-2)}
.postbl .asset-cell{min-width:150px}
.postbl .asset-cell .nm{max-width:150px}
.postbl th,.postbl td{padding-left:7px;padding-right:7px}
.postbl .rowact{flex-direction:column;align-items:stretch;gap:2px}
.notecell{white-space:normal;min-width:120px;max-width:260px}
.txtbl td.plv{white-space:normal;min-width:100px;max-width:150px;line-height:1.3}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mc-body .small{overflow-wrap:anywhere}

/* Forms */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:minmax(0,1fr)}}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
tr.fgh td{padding-top:16px;border-bottom:1px solid var(--line)} tr.fgs td{font-weight:700;border-top:1px solid var(--line)} .mrow.fgs .l1{font-weight:700} .fsub{font-size:15px;margin:18px 0 4px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
label.f .hint{font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--loss);font-size:13px}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.typepick button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}
.results button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--grid);padding:8px 10px}
.results button:hover{background:var(--surface-2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.progress{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;width:180px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:75ch}
details summary{cursor:pointer;color:var(--ink-2);font-weight:500}

/* v5: tiles, insights, summary */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .l{font-size:13px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:13px;color:var(--muted);font-family:var(--f-num)}
.chart.tall{height:320px}
.donut-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:520px){.donut-wrap{grid-template-columns:minmax(0,1fr)}}
.donut-wrap .chart.donut{height:200px}
.alloc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.alloc-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto 44px;gap:8px;align-items:center;font-size:13px}

/* ===== Calm: stone background, flat white cards, one ink-blue accent, Manrope only (4 sizes: 40·22·15·13, 2 weights: 500·700) ===== */

/* Buttons and controls */

.rv-b{flex:1;min-width:0}
.rv-t{font-size:15px;font-weight:700;line-height:1.35}
.rv-b .small{line-height:1.45}
.rv-i>a,.rv-i>.btn{flex:0 0 auto}
.rv-more summary{font-size:13px;color:var(--muted);cursor:pointer;padding-top:4px}
.rv-more .rv-list{margin-top:8px}
.rv-more .rv-list .rv-i:first-child{border-top:1px solid var(--line);padding-top:10px}
/* Footer rows */
.pos-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
/* Reparto */
#repPanel .seg{align-self:flex-start}
.rep-body{display:flex;flex-direction:column;gap:12px}
.rep-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg-sm button{font-size:13px;padding:4px 10px}
.rep-tgt{border-top:1px solid var(--line);padding-top:12px}
.tp-row.alink{display:grid;width:100%;box-sizing:border-box;padding:2px 0}
.tp-bar{position:relative}
.tp-tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.tp-w{text-align:right}.tp-w small{display:block;font-size:12px}
#repPanel .tp-bar{overflow:visible}
/* World map */
.zmap{margin:0;display:flex;flex-direction:column;gap:10px}
.zmap svg{width:100%;height:auto;display:block}
.zm-rest{fill:var(--ink);fill-opacity:.07;stroke:var(--surface);stroke-width:.6}
.zm-z{fill:var(--accent);stroke:var(--surface);stroke-width:.8}
.zm-z:hover{stroke:var(--ink);stroke-width:1.4}
.zm-lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.zm-li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:8px;align-items:baseline;font-size:13px}
.zm-li i{width:12px;height:12px;border-radius:3px;background:var(--accent);align-self:center}
.zm-li .zm-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zm-li .small{grid-column:2 / 4}
/* Cash and Transactions cards in Portfolio */
.cc-tot{font-size:22px}
.cc-list{display:flex;flex-direction:column}
.cc-row{display:flex;align-items:center;gap:12px;padding:8px 0;color:inherit;text-decoration:none;min-height:44px}
.cc-row:hover .cc-b b{text-decoration:underline}
.cc-ic{flex:0 0 36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.cc-b{flex:1;min-width:0;display:flex;flex-direction:column}
.cc-row .chev,.mv-r .chev{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;flex:0 0 auto}
.mv-list{display:flex;flex-direction:column}
.mv-r{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.mv-list .mv-r:first-child{border-top:0;padding-top:0}
.mv-l{min-width:0}.mv-l small{display:block;font-size:13px;color:var(--muted)}
.mv-r>.num{white-space:nowrap;font-weight:700}
.pos-foot .btn{min-height:36px}
.cashsw{background:var(--accent-soft);border:1px solid var(--accent)}
/* Analysis */
.an-top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.an-more summary{font-size:13px;color:var(--muted);cursor:pointer}
.an-more .stats{margin-top:8px}

.idx-euros b{color:var(--ink)}
/* Plan */
.pj-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.pj-chips .chip{font-weight:500;background:var(--surface-2);color:var(--ink)}

/* Transactions (desktop): the note wraps so the table fits without overflowing the page */
.txtbl td:nth-child(9){white-space:normal;min-width:90px;max-width:170px;font-size:13px;line-height:1.35}
.txtbl tr.cashrow td:nth-child(3){white-space:nowrap}

.txtbl td:last-child{white-space:normal;width:1%}.txtbl td:last-child .rowact{min-width:0;max-width:150px}.txtbl td:nth-child(3){max-width:190px;white-space:normal}

.rv-i>a{justify-content:flex-end}

.heat th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:6px 0 6px -6px rgba(0,0,0,.18)}
.heat th:first-child::before{content:"";position:absolute;top:-2px;bottom:-2px;right:100%;width:18px;background:var(--surface)}
.heat thead th:first-child{background:var(--surface)}

.zm-rest{fill-opacity:.09}

.zmap>.seg{align-self:flex-start;width:auto}
.g-2e:has(>section[hidden]){grid-template-columns:minmax(0,1fr)}
/* Plan: the projection that adds up */
#pjTiles{grid-template-columns:minmax(0,1fr)}
.pj-sum{display:flex;flex-direction:column;gap:14px}
.pj-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pj-top>div{display:flex;flex-direction:column;gap:2px}
.pj-big{font-size:40px!important;line-height:1.1}
.pj-rng{text-align:right}.pj-rng b{font-size:17px}
.pj-eqbar{display:flex;gap:3px;height:12px}.pj-eqbar i{border-radius:99px;display:block}
.pj-eq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start}

.pj-cash{margin:0;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.zm-li .zm-n{white-space:normal;overflow:visible;text-overflow:clip}

}

.pdate{white-space:nowrap!important;max-width:none!important}

.heatv{width:100%}
.heatv td.cell{min-width:0}

.heatv tr.yr th,.heatv tr.yr td{border-top-width:8px}

/* Ronda 9 */
#modal .panel-h{flex-wrap:nowrap;align-items:flex-start}
#modal .panel-h h2{flex:1;min-width:0}
#modal .panel-h>[data-close]{flex:0 0 auto}
.lots-more summary{cursor:pointer;color:var(--accent);font-weight:600}
@media (min-width:1024px){.postbl .asset-cell .nm{max-width:190px;white-space:normal;overflow:visible;text-overflow:clip}}
</style>

<style id="anim">
/* Motion: transform/opacity only; colours and sizes stay with the main stylesheet */
@keyframes mIn{from{opacity:0;transform:translate3d(var(--mdx,0px),var(--mdy,8px),0)}}
@keyframes mFade{from{opacity:0}}
@keyframes mFadeOut{to{opacity:0}}
@keyframes mPop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes mPopOut{to{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes mSheet{from{transform:translateY(100%)}}
@keyframes mSheetOut{to{transform:translateY(100%)}}
@keyframes mToast{from{opacity:0;transform:translate(-50%,12px) scale(.97)}}
@keyframes mSpin{to{transform:rotate(360deg)}}
@keyframes mPulse{50%{opacity:.45}}
@keyframes mBump{40%{transform:scale(.84)}75%{transform:scale(1.08)}}
.m-enter>*,.m-enter .tiles>*,.m-enter .kpis>*{animation:mIn .42s cubic-bezier(.2,.75,.25,1) backwards;animation-delay:calc(var(--mi,0)*45ms)}
.m-enter .tiles>*,.m-enter .kpis>*{--mdx:0px;--mdy:6px}
.btn,.seg button,.fchip,.typepick button,.sheet-list button,.toast-act,.thsort,.hint-btn{transition:transform .12s ease,background-color .15s,border-color .15s,box-shadow .15s,color .15s,filter .15s}
.btn:active:not(:disabled),.fchip:active,.typepick button:active,.toast-act:active{transform:scale(.96)}
.seg button:active:not(:disabled){transform:scale(.94)}
.sheet-list button:active{transform:scale(.98)}
tbody td{transition:background-color .12s}
#btnRefresh:disabled svg{animation:mSpin .9s linear infinite}
#btnTheme svg{transition:transform .35s cubic-bezier(.2,.75,.25,1)}
#btnTheme:active svg{transform:rotate(-30deg) scale(.9)}
nav.tabs .m-ink{position:absolute;left:0;bottom:0;width:100px;height:2px;border-radius:2px;background:var(--accent);transform-origin:0 0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.75,.25,1)}
nav.tabs.m-ink-on button[aria-selected="true"]{border-bottom-color:transparent}
nav.tabs button{transition:color .2s}
.bnav button svg{transition:transform .15s ease}
.bnav button:active svg{transform:scale(.86)}
.bnav button[aria-current="page"] svg{animation:mBump .38s ease-out}
.bnav .bplus .circ{transition:transform .15s ease}
.bnav .bplus:active .circ{transform:scale(.9)}
.bnav .bplus .circ svg{transition:transform .25s cubic-bezier(.2,.75,.25,1)}
body:has(#overlay:not([hidden])) .bnav .bplus .circ svg{transform:rotate(45deg)}
.overlay:not([hidden]){animation:mFade .18s ease-out}
.modal{animation:mPop .22s cubic-bezier(.2,.75,.25,1)}
.overlay.m-ghost{z-index:49;pointer-events:none;animation:mFadeOut .18s ease-in forwards}
.overlay.m-ghost .modal{animation:mPopOut .18s ease-in forwards}
.toast:not([hidden]){animation:mToast .26s cubic-bezier(.2,.75,.25,1)}
details.mcard[open]>.mc-body,details.ls-more[open]>:not(summary),details[open]>.explain{animation:mIn .24s ease-out;--mdy:-4px}
@media (max-width:640px){
  .modal{animation:mSheet .3s cubic-bezier(.2,.8,.2,1)}
  .overlay.m-ghost .modal{animation:mSheetOut .22s cubic-bezier(.4,0,1,1) forwards}
}
/* v17 */
@keyframes mGrow{from{transform:scaleX(0)}}
@keyframes mTurn{from{transform:rotate(-120deg) scale(.6);opacity:0}}
#heroRes:not([hidden]){animation:mIn .4s .8s ease-out backwards;--mdy:4px}
.tp-bar span{transform-origin:0 50%}
.m-enter .tp-bar span{animation:mGrow .6s cubic-bezier(.2,.75,.25,1) backwards;animation-delay:calc(160ms + var(--mj,0)*40ms)}
.m-enter .mixbar{animation:mGrow .7s .2s cubic-bezier(.2,.75,.25,1) backwards}
#btnTheme.m-turn svg{animation:mTurn .45s cubic-bezier(.2,.75,.25,1)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.m-vt-fade::view-transition-old(root){animation:mFadeOut .2s ease both}

<script>
/* Portfolio engine — pure functions, no DOM. Base currency EUR.
 *
 * Input state:
 *  assets:  [{id, name, ticker, type:'etf'|'stock'|'crypto'|'fund'|'cash'|'other', currency:'EUR'|'USD'|..., broker, tag, target (0..1)}]
 *  txs:     [{id, date:'YYYY-MM-DD', type, assetId, qty, price, fees, fx, amount, withholding, ratio, seq}]
 *           buy/sell: qty, price (asset ccy), fees (EUR), fx (EUR per 1 unit of asset ccy; optional)
 *           dividend: amount (gross, asset ccy), withholding (asset ccy), fx
 *           interest: amount (gross EUR), withholding (EUR)          — assetId optional
 *           fee:      amount (EUR)                                   — assetId optional
 *           split:    ratio (new units per old unit)
 *  history: {assetId: [[date, close], ...]}  close in asset currency
 *  fx:      {USD: [[date, eurPerUnit], ...], ...}
 *  benchmark: [[date, valueEUR], ...] (optional)
 *  settings: {riskFree: 0.02 (annual), today: 'YYYY-MM-DD'}
 */
(function (root) {
  'use strict';
  const DAY = 86400000;
  const BASE = 'EUR';
  const t = (d) => Date.parse(d + 'T00:00:00Z');
  const ds = (ms) => new Date(ms).toISOString().slice(0, 10);
  const addDays = (d, n) => ds(t(d) + n * DAY);
  const dow = (d) => new Date(t(d)).getUTCDay();
  const num = (x, dflt = 0) => { const v = typeof x === 'string' ? parseFloat(x.replace(',', '.')) : x; return Number.isFinite(v) ? v : dflt; };
  const EPS = 1e-9;

  function addMonths(d, n) {
    const dt = new Date(t(d));
    const day = dt.getUTCDate();
    dt.setUTCDate(1);
    dt.setUTCMonth(dt.getUTCMonth() + n);
    const last = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
    dt.setUTCDate(Math.min(day, last));
    return ds(dt.getTime());
  }

  /** Step lookup over a [[date,value]] series: last value with date <= d. */
  function lookup(series, interp) {
    const s = (series || []).filter((p) => p && p[0] && Number.isFinite(+p[1]) && +p[1] > 0)
      .map((p) => [p[0], +p[1]]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
    const dates = s.map((p) => p[0]);
    const vals = s.map((p) => p[1]);

      let lo = 0, hi = dates.length - 1, ans = -1;
      while (lo <= hi) { const m = (lo + hi) >> 1; if (dates[m] <= d) { ans = m; lo = m + 1; } else hi = m - 1; }

    const settings = state.settings || {};
    const today = settings.today || ds(Date.now());
    const rf = num(settings.riskFree, 0.02);
    const assets = state.assets || [];
    const assetById = Object.fromEntries(assets.map((a) => [a.id, a]));
    const txs = normalizeTxs(state.txs).filter((x) => x.date <= today);
    const warnings = [];

    // FX lookups
    const fxL = {};

    for (const a of assets) {

      // Trade prices are real observations too: they fill any date without a close (history wins on the same date).
      const histDates = new Set(histL[a.id].points.map((p) => p[0]));
      const extra = (txPricePts[a.id] || []).filter((p) => !histDates.has(p[0]));

      // instead of drawing stairs. Daily series keep the last close.
      const hp = histL[a.id].points; let sparseH = false;
      if (hp.length >= 2) { const gaps = []; for (let i = Math.max(1, hp.length - 120); i < hp.length; i++) gaps.push((t(hp[i][0]) - t(hp[i - 1][0])) / DAY); gaps.sort((x, y) => x - y); sparseH = gaps[Math.floor(gaps.length / 2)] > 3; }

async function saveCashMoves(c, mvList) {
  const mv = {}; for (const m of mvList) mv[m.id] = { d: m.d, a: +m.a.toFixed(2), t: m.t, n: m.n || '' };
  const tmp = Object.assign({}, c, { mv }); delete tmp.h; delete tmp.id;
  const bal = cashBal(tmp); const last = mvList.reduce((x, m) => (m.d > x ? m.d : x), '');

/** Adds one movement with a merge-write, so two devices adding movements at the same time never overwrite each other. */
async function addCashMove(c, mvList, id) {

  // 5. YTD

  if (sb && ok(sb.twr)) { const d = res.stats.twr - sb.twr; out.push({ tone: d >= 0 ? 'good' : 'warn', prio: 1, title: `Against ${esc(benchName())}`, text: `Since you started, your strategy ${d >= 0 ? 'beats' : 'trails'} the index by <b>${ppt(Math.abs(d), 1)}</b> (${pctS(res.stats.twr, 1)} against ${pctS(sb.twr, 1)}).${lb ? ` The same money, on the same dates, in the index would be worth <b>${eur(lb.simValue, 0)}</b> (you: ${eur(t.value, 0)}).${eurGapNote(lb.simValue, t.value, d)}` : ''}` }); }

  // 7. timing: XIRR vs TWR

  // 10. taxes this year + harvesting

/** Rules: the diagnosis that Claude has to respect. */

  const val = (f) => open.filter(f).reduce((s, z) => s + z.value, 0);
  const byCls = {}; for (const z of open) { const k = clsOf(z.asset); byCls[k] = (byCls[k] || 0) + z.value; }

  const riskW = lt > 0 ? ltRisk / lt : 0, cryptoW = lt > 0 ? crypto / lt : 0;
  const eq = open.filter((z) => clsOf(z.asset) === 'rv'); const eqV = eq.reduce((s, z) => s + z.value, 0);
  const sub = {}; for (const z of eq) { const k = subOf(z.asset); sub[k] = (sub[k] || 0) + z.value / (eqV || 1); }

  const ltByCls = Object.assign({}, byCls); let take = earmark; for (const k of ['rf', 'oro', 'rv', 'cripto', 'otro']) { const t = Math.min(ltByCls[k] || 0, take); ltByCls[k] = (ltByCls[k] || 0) - t; take -= t; }
  const crisis = lt > 0 ? Object.entries(ltByCls).reduce((s, [k, v]) => s + v * (AN_CRISIS[k] ?? 0.3), 0) / lt : 0;
  const yrs = g && g.date ? (Date.parse(g.date) - Date.parse(todayStr())) / (365.25 * 864e5) : null;
  const out = []; const add = (r) => out.push(r);
  const band = `${pct(L.lo, 0)}–${pct(L.hi, 0)}`;

  } else if (riskW < L.lo - 0.005) add({ id: 'level', sev: L.lo - riskW > 0.15 ? 2 : 1, tone: 'info', act: 'add', title: 'Less risk than you could take', text: `Only ${pct(riskW, 0)} of your long-term money is in risky assets; your ${L.name.toLowerCase()} profile allows ${band}. Over the long term, that usually means a lower expected return.` });
  else add({ id: 'level', sev: 0, tone: 'good', act: 'keep', title: 'Risk in line with your profile', text: `${pct(riskW, 0)} of your long-term money is in risky assets, within the range of a ${L.name.toLowerCase()} profile (${band}).${cashNote}` });
  // 1b. crisis test against the drop you said you can bear
  if (lt > 0) {
    const t = `In a crisis like 2008–09 (stocks ≈ −50 %, crypto ≈ −75 %) your long-term money would fall by around <b>${pct(crisis, 0)}</b>, about ${eur(crisis * lt, 0)}.`;
    if (crisis > L.maxDD + 0.05) add({ id: 'crash', sev: 1, tone: 'warn', act: 'reduce', title: 'It would fall more than you can bear', text: `${t} You said you could watch up to ${pct(L.maxDD, 0)} without losing sleep. Selling in the middle of a fall turns a temporary loss into a permanent one: better to adjust the mix now, calmly.` });

  }

    const sev = yrs == null || yrs < 3 ? 2 : yrs < 5 ? 1 : 0;
    add({ id: 'goal', sev, tone: sev ? 'warn' : 'info', act: sev ? 'reduce' : 'watch', title: sev ? 'Goal money in stocks' : 'Distant goal, still in stocks', text: `You say ${eur(earmark, 0)} of your investments is for your goal, but only ${eur(rfV, 0)} is in bonds: about <b>${eur(atRisk, 0)}</b> depends on the stock market${inGold ? ` or on gold (${eur(inGold, 0)}; gold has fallen as much as 40 %)` : ''}. ${when} ${sev ? `A 25 % fall would take ${eur(atRisk * 0.25, 0)} just when you need it.` : 'There is time, but it is worth moving it to short-term bonds as the date gets closer (out of stocks by 3 years before).'}` });
  } else if (earmark > 0) add({ id: 'goal', sev: 0, tone: 'good', act: 'keep', title: 'The goal money is safe', text: `The ${eur(earmark, 0)} you set aside for your goal fits within your bonds (${eur(rfV, 0)}).` });
  // 3. cash
  if (P.cash > 0) {

    else if (g) add({ id: 'cash', sev: 0, tone: 'good', act: 'keep', title: 'Cash with a purpose', text: `Your ${eur(P.cash, 0)} of cash is set aside for ${cu ? 'the emergency fund and ' : ''}your goal "${esc(g.name)}"${g.left > 0 ? ` (you have ${pct(g.share, 0)}; ${eur(g.left, 0)} to go)` : ''}, so I do not count it as idle money. For a near-term expense, cash is the prudent choice even if it earns little.` });

    const conc = (sub.single || 0) + (sub.sector || 0); if (conc > 0.15) add({ id: 'concentrated', sev: 1, tone: 'warn', act: 'reduce', title: 'Single stocks and sectors', text: `Individual stocks and sector funds add up to ${pct(conc, 0)} of your stocks. In an index portfolio they usually stay below 10–15 %.` });
    if (usW <= 0.8 && em <= 0.2 && conc <= 0.15) add({ id: 'diversif', sev: 0, tone: 'good', act: 'keep', title: 'Well spread stocks', text: `The US is ≈ ${pct(usW, 0)} of your stocks (≈ 62 % in the world) and you do not depend on single stocks or sectors.` });

/* ---------- Assets and settings ---------- */
/** Yearly management cost in € of a position: TER (asset.ter, a fraction like target) × value. null without TER. */
function terCost(p) { const t = p && p.asset ? p.asset.ter : null; return t != null && t !== '' && Number.isFinite(+t) && +t >= 0 && p.value > 0 ? p.value * +t : null; }
function feesPanel() {
  if (!res) return ''; const ps = res.positions.filter((p) => p.open && p.value > 0); if (!ps.length) return '';
  const w = ps.filter((p) => terCost(p) != null), y = w.reduce((s, p) => s + terCost(p), 0), v = w.reduce((s, p) => s + p.value, 0), vAll = ps.reduce((s, p) => s + p.value, 0);
  const fees = res.totals.tradingFees || 0;
  return `<section class="panel"><h2>What you pay in management fees</h2>
    ${w.length ? `<div class="tbl-wrap" style="max-width:760px"><table style="margin-top:8px"><thead><tr><th>Asset</th><th class="n">Value</th><th class="n">TER</th><th class="n">€/year</th></tr></thead><tbody>${ps.map((p) => { const c = terCost(p); return `<tr><td><span class="sw" style="background:${acolor(p.assetId)};display:inline-block;margin-right:6px"></span>${esc(p.asset.ticker || p.asset.name)}</td><td class="n">${eur(p.value, 0)}</td><td class="n">${c != null ? pct(+p.asset.ter, 2) : '<span class="muted">—</span>'}</td><td class="n">${c != null ? eur(c) : ''}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="stats" style="margin-top:10px;max-width:760px"><div class="stat"><span class="k">Per year</span><span class="v">${eur(y)}</span></div><div class="stat"><span class="k">Per month</span><span class="v">${eur(y / 12)}</span></div><div class="stat"><span class="k">Average TER<small>weighted by value</small></span><span class="v">${pct(v > 0 ? y / v : null, 3)}</span></div></div>
    ${w.length < ps.length ? `<p class="note">No TER: ${ps.filter((p) => terCost(p) == null).map((p) => esc(p.asset.ticker || p.asset.name)).join(', ')} (${eur(vAll - v, 0)}). They do not count in the total or the average.</p>` : ''}`
    : `<p class="note">Note the TER (annual fee) of each fund in "Edit" to see how much it costs you a year.</p>`}
    <p class="note">Separately, trading fees paid since the start: <b>${eur(fees)}</b>. The TER is already taken out of the NAV: it is a cost you do not see, not a charge.</p></section>`;
}

/* ================= Sections (v3 "simplified"): Home, Portfolio, Analysis and Plan =================
 * Each section answers one question: how am I doing?, what do I have?, am I doing it right?, where am I heading?
 * It reuses the usual panels; they are only grouped here. Cash, Transactions and Taxes
 * become details of Portfolio and Analysis, and Settings opens from the gear icon.
 */
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const since = () => '<span class="since">since the start</span>';

/* ---------- Home ---------- */
const RV_TAG = { 'Concentration': 'Weight', 'Disproportionate risk': 'Risk', 'Off your plan': 'Target', 'Your cash': 'Cash' };
/** Warnings that ask for something: interest not recorded, deferred losses and the "warn" insights. */
function reviewItems() {
  const out = []; if (!res || DEMO) return out;
  const y = res.totals.today.slice(0, 4);
  for (const h of interestHints(y)) out.push({ prio: 0, tag: 'Interest', title: `${res.incomeRows.some((r) => r.type === 'interest' && String(r.year) === String(y)) ? 'Missing interest' : 'Interest not recorded'} in ${esc(h.c.name)}`, sub: `${(() => { const got = res.incomeRows.filter((r) => r.type === 'interest' && String(r.year) === String(y)).reduce((t, r) => t + (+r.gross || +r.amount || 0), 0); return got >= 1 ? `you have ${eur(got, 0)} gross recorded; about ${eur(h.n, 0)} from ${h.months} month${h.months === 1 ? '' : 's'} is missing` : `it would be around ${eur(h.n, 0)} over ${h.months} month${h.months === 1 ? '' : 's'} of ${y}`; })()} · it counts for your tax return`, act: `<button class="btn small" type="button" data-mv="interest" data-acc="${esc(h.c.id)}">Record</button>` });
  const f = res.fiscal[y];
  if (f && f.deferredPending < -0.004) out.push({ prio: 3, tag: 'Taxes', title: 'Losses deferred by the wash-sale rule', sub: `${eur(-f.deferredPending)} you cannot offset yet (wash-sale rule)`, act: '<a href="#taxes" data-goto="taxes" class="small">View</a>' });
  for (const i of buildInsights()) if (i.tone === 'warn') {
    if (/^Against/.test(i.title)) { out.push({ prio: i.prio, tag: 'Index', title: `You are behind ${esc(benchName())}`, sub: (() => { const ix = typeof indexInfo === 'function' && indexInfo(); return ix && ix.sim > ix.V ? `since you started: with the index you would have ${eur(ix.sim - ix.V, 0)} more` : 'since you started'; })(), act: '<a href="#analysis" data-goto="analysis" data-period="MAX" data-to="idxPanel" class="small">View</a>' }); continue; }
    out.push({ prio: i.prio, tag: RV_TAG[i.title] || 'Warning', title: i.title, sub: i.text });
  }
  return out.sort((a, b) => a.prio - b.prio);
}
function toReview() {
  if (!res || DEMO) return '';
  const it = reviewItems(), top = it.slice(0, 3), more = it.slice(3), rest = buildInsights().filter((i) => i.tone !== 'warn');
  const nb = (t) => String(t).replace(/(\d) %/g, '$1\u00a0%').replace(/(\d) €/g, '$1\u00a0€');
  const li = (x) => `<div class="rv-i"><span class="rv-tag">${x.tag}</span><div class="rv-b"><div class="rv-t">${nb(x.title)}</div><div class="small muted">${nb(x.sub)}</div></div>${x.act || ''}</div>`;
  const sum = [more.length ? `${more.length} more warning${more.length === 1 ? '' : 's'}` : '', rest.length ? `${rest.length} fact${rest.length === 1 ? '' : 's'} about your portfolio` : ''].filter(Boolean).join(' and ');
  return `<section class="panel" id="revPanel"><div class="panel-h"><h2>To review</h2><span class="small muted">${it.length ? (it.length === 1 ? '1 warning' : `${it.length} warnings`) : 'nothing pending'}</span></div>
    ${top.length ? `<div class="rv-list">${top.map(li).join('')}</div>` : '<p class="small muted" style="margin:0">All in order: there is nothing to review.</p>'}
    ${sum ? `<details class="rv-more"><summary>${sum}</summary>${more.length ? `<div class="rv-list">${more.map(li).join('')}</div>` : ''}${rest.length ? `<div class="ins-list" style="margin-top:10px">${rest.map(insightCard).join('')}</div>` : ''}</details>` : ''}
  </section>`;
}
function vHome() {
  if (!res || !res.series.length) return emptyState('Add assets and transactions to see your portfolio.');
  return `<div class="grid g-2e">${moveBreakdown() || ''}${toReview()}</div>
  ${estPanel()}
  ${dropLine()}
  ${goalLine()}
  <section class="panel">
    <div class="panel-h"><h2>Over time</h2>${periodSeg(ui.period, 'p')}</div>
    <div class="evo-bar">${evoSeg()}<div class="legend" id="mainLegend"></div></div>
    <div class="chart tall"><canvas id="cMain" role="img" aria-label="Net worth over time"></canvas></div>
    <div class="small muted" id="mainFoot"></div>
  </section>`;
}
vHome.after = function () { vSummary.after(); };
/** The savings goal in one line (the detail lives in Plan). */
function goalLine() {
  const g = typeof goalInfo === 'function' && goalInfo(); if (!g) return '';
  return `<section class="panel" id="goalLine"><div class="rv-i rv-solo"><span class="rv-tag">Goal</span><div class="rv-b"><div class="rv-t">${esc(g.name)}: ${pct(g.share, 0)}</div><div class="small muted">${g.left > 0 ? `${eur(g.cash, 0)} of ${eur(g.amount, 0)}${g.cu ? ` (without your ${eur(g.cu.amount, 0)} emergency fund)` : ''} · ${eur(g.left, 0)} to go${g.eta && g.pace > 0 ? ` · at your pace, around ${fdate(g.eta, { day: undefined })}` : ''}` : 'goal reached'}</div><div class="goalbar" style="margin-top:6px" aria-hidden="true"><span style="width:${(g.share * 100).toFixed(1)}%"></span></div></div><a href="#plan" data-goto="plan" class="small">View</a></div></section>`;
}
/** The drop warning in one line (the history of drops lives in Analysis › Risk and drawdowns). Same rule as dropPanel: a week down 3 % or more. */
function dropLine() {
  if (!res || DEMO || res.series.length < 30) return '';
  const th = 0.03; const W = weekRets(); if (!W.length) return '';
  const today = res.totals.today; const dow = (new Date(today + 'T00:00:00Z').getUTCDay() + 6) % 7;
  let cur = W[W.length - 1]; if (!(cur.r <= -th) && dow <= 1 && W.length > 1 && W[W.length - 2].mon === E.addDays(monOf(today), -7)) cur = W[W.length - 2];
  if (!(cur.r <= -th) || cur.mon < E.addDays(monOf(today), -7)) return '';
  const isThis = cur.mon === monOf(today);
    return `<section class="panel" id="dropPanel"><div class="rv-i rv-solo"><span class="rv-tag">Drop</span><div class="rv-b"><div class="rv-t">${isThis ? 'This week your investments have fallen' : 'Last week your investments fell'} ${pct(-cur.r, 1)}</div><div class="small muted">from ${fdate(cur.mon, { year: undefined })} to ${fdate([cur.end || E.addDays(cur.mon, 4), lastMktDate() || '9999'].sort()[0], { year: undefined })} · not counting cash</div></div><a href="#analysis" data-goto="analysis" data-to="riskPanel" class="small">View</a></div></section>`;
}

/* ---------- Portfolio ---------- */
const repView = () => (ui.rep = ui.rep || lsGet('portfolio-rep', 'class'));
const zMapOn = () => (ui.zmap == null ? (ui.zmap = lsGet('portfolio-zmap', '0') === '1') : ui.zmap);
const zDevOn = () => (ui.zdev == null ? (ui.zdev = lsGet('portfolio-zdev', '0') === '1') : ui.zdev);
document.addEventListener('click', (e) => {
  const z = e.target.closest('.zmap [data-z]'); if (z) { const box = $('#zmInfo'); if (box) box.innerHTML = z.dataset.info; $$('.zmap [data-z]').forEach((x) => x.classList.toggle('on', x.dataset.z === z.dataset.z)); return; }
  const b = e.target.closest('[data-rep],[data-zmap],[data-taxy],[data-zdev]'); if (!b) return;
  if (b.dataset.zdev) { ui.zdev = b.dataset.zdev === '1'; lsSet('portfolio-zdev', ui.zdev ? '1' : '0'); render(); return; }
  if (b.dataset.rep) { ui.rep = b.dataset.rep; lsSet('portfolio-rep', ui.rep); }
  else if (b.dataset.zmap) { ui.zmap = b.dataset.zmap === '1'; lsSet('portfolio-zmap', ui.zmap ? '1' : '0'); }
  else { ui.taxY = b.dataset.taxy; ui.fiscalYear = ui.taxY; }
  render();
});
/** World map of the money in equities: each MSCI zone is shaded by its weight; the legend shows the world weight next to it. */
function zoneMap(rows) {
  const W = WORLD_MAP; const dev = true; const w = Object.fromEntries(rows.map((r) => [r.k, r]));
  const gap = (r) => r.w * 100 - ZONE_WORLD[r.k]; const maxW = Math.max(...rows.map((r) => r.w), 0.01), maxG = Math.max(...rows.map((r) => Math.abs(gap(r))), 1);
  const paint = (r) => (dev ? { c: gap(r) >= 0 ? 'var(--accent)' : 'var(--s4)', o: (0.3 + 0.65 * Math.abs(gap(r)) / maxG).toFixed(2) } : { c: 'var(--accent)', o: (0.3 + 0.65 * r.w / maxW).toFixed(2) });
  const g = (r) => { const d = gap(r); return `${d >= 0 ? '+' : '−'}${numf(Math.abs(d), 0)} p. p.`; };
  const info = (r) => `<b>${r.l}</b>: ${pct(r.w, 0)} of your stocks (${eur(r.v, 0)}); in world stocks, ${ZONE_WORLD[r.k]} %. ${gap(r) >= 0 ? 'It weighs more' : 'It weighs less'} than in the world: ${g(r)}`;
  return `<figure class="zmap">
    <svg viewBox="0 0 800 ${W.h}" role="img" aria-label="World map: ${rows.map((r) => `${r.l} ${pct(r.w, 0)}, world ${ZONE_WORLD[r.k]} %`).join('; ')}">
      <path d="${W.p.rest}" class="zm-rest"><title>No weight in your funds</title></path>
      ${ZONES.map(([k]) => { const p = paint(w[k]); return `<path d="${W.p[k]}" class="zm-z" style="fill:${p.c};fill-opacity:${p.o}" data-z="${k}" data-info="${esc(info(w[k]))}"><title>${esc(info(w[k]).replace(/<[^>]+>/g, ''))}</title></path>`; }).join('')}

/** Once a day (when the page opens and the data changed) a full copy of operations, assets, cash and settings is kept in "backups"

    if (!force && metas.length && metas[0][1].fp === fp) { maybeSnapshot.doneFor = today; return; }
    if (!force && S.backups[today] && S.backups[today].fp === fp) { maybeSnapshot.doneFor = today; return; }

const EUR_RX = /[+\-−]?\s?(?:€|(?:US|CA|AU|HK)?\$|£|CHF\s?|GBX\s?)\s?[+\-−]?\d[\d,]*(?:\.\d+)?(?:\s?[kM])?(?:\/(?:year|month))?|[+\-−]?\d[\d,]*(?:\.\d+)?\s?(?:[kM]\s?)?(?:€|CHF|GBX|GBp)(?:\/(?:year|month))?/g;
const CCY_HAS = /€|\$|£|CHF|GBX|GBp/;
function markPriv(root) {
  if (!privOn || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (CCY_HAS.test(n.nodeValue) && n.parentElement && !n.parentElement.closest('.pv,script,style') ? 1 : 3) });
  const hits = []; let n; while ((n = w.nextNode())) hits.push(n);
  for (const t of hits) {
    const p = t.parentElement, txt = t.nodeValue;
    if (txt.trim().length <= 24 && p.childNodes.length === 1) { p.classList.add('pv'); continue; }
    const frag = document.createDocumentFragment(); let i = 0; txt.replace(EUR_RX, (m, at) => { if (at > i) frag.appendChild(document.createTextNode(txt.slice(i, at))); const sp = document.createElement('span'); sp.className = 'pv'; sp.textContent = m; frag.appendChild(sp); i = at + m.length; return m; });
    if (i) { if (i < txt.length) frag.appendChild(document.createTextNode(txt.slice(i))); t.replaceWith(frag); }
  }
}
function applyPriv() { document.body.classList.toggle('priv', privOn); const b = $('#btnPriv'); b.setAttribute('aria-pressed', String(privOn)); b.title = privOn ? 'Show amounts' : 'Hide amounts'; b.setAttribute('aria-label', b.title); markPriv(document.body); }
new MutationObserver((recs) => { if (!privOn) return; for (const r of recs) { if (r.type === 'characterData') markPriv(r.target.parentElement); else r.addedNodes.forEach((x) => markPriv(x.nodeType === 3 ? x.parentElement : x)); } }).observe(document.body, { childList: true, subtree: true, characterData: true });
$('#btnPriv').addEventListener('click', () => { privOn = !privOn; try { localStorage.setItem('portfolio-priv', privOn ? '1' : '0'); } catch (e) {} applyPriv(); toast(privOn ? 'Amounts hidden. Tap the eye to show them.' : 'Amounts visible.'); });
applyPriv();
const reTheme = () => { if (!$('#overlay').hidden) return; render(); };
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme); } catch (e) {}
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// Charts: append a short reading of the data to the canvas label, for screen readers
function chartAria(ch, fmt) {
  const cv = ch && ch.canvas; if (!cv) return;
  try {
    const base = cv.dataset.al != null ? cv.dataset.al : (cv.dataset.al = cv.getAttribute('aria-label') || '');
    const f = (v) => { let r; try { r = fmt ? fmt(v) : null; } catch (e) {} return typeof r === 'string' ? r : eur(v, 0); };
    const L = ch.data.labels || [], num = (d) => (d && typeof d === 'object' ? d.y : d);
    const lab = (l) => (/^\d{4}-\d{2}-\d{2}$/.test(l) ? fdate(l) : /^\d{4}-\d{2}$/.test(l) ? mmName(l) : String(l));
    const ds = ch.data.datasets.filter((d) => !d.hidden); let s = '';
    if (ch.config.type === 'doughnut') { const d = ds[0].data, tot = d.reduce((a, b) => a + (+b || 0), 0); s = L.map((l, i) => `${l} ${f(d[i])} (${pct(d[i] / tot, 0)})`).join(', '); }
    else if (ch.config.type === 'bar') {
      if (L.length <= 12 && ds.length === 1) s = L.map((l, i) => `${lab(l)} ${f(num(ds[0].data[i]))}`).join(', ');
      else s = (L.length > 1 ? `From ${lab(L[0])} to ${lab(L[L.length - 1])}. ` : '') + ds.filter((d) => d.label).slice(0, 4).map((d) => { const v = d.data.map(num); const tot = v.reduce((a, b) => a + (ok(b) ? b : 0), 0); let m = -1; v.forEach((x, i) => { if (ok(x) && (m < 0 || Math.abs(x) > Math.abs(v[m]))) m = i; }); return `${d.label}: total ${f(tot)}${m >= 0 ? `, maximum ${f(v[m])} in ${lab(L[m])}` : ''}`; }).join('. ');
    } else {
      const parts = ds.filter((d) => d.label && d.borderColor !== 'transparent' && d.data.some((x) => num(x))).slice(0, 6).map((d) => { const v = d.data.map(num); if (d.mk) return `${d.label}: ${v.filter(ok).length}`; let a = -1, b = -1; v.forEach((x, i) => { if (ok(x)) { if (a < 0) a = i; b = i; } }); return a < 0 ? '' : a === b ? `${d.label}: ${f(v[b])}` : `${d.label}: from ${f(v[a])} to ${f(v[b])}`; }).filter(Boolean);
      s = (L.length > 1 ? `From ${lab(L[0])} to ${lab(L[L.length - 1])}. ` : '') + parts.join('. ');
    }
    cv.setAttribute('aria-label', (base ? base + '. ' : '') + s);
  } catch (e) {}
}
// Tabs: roving tabindex, tab/panel links and arrow keys (reads whatever tabs #tabs holds)

  tabs.forEach((b) => { if (!b.id) b.id = 'tab-' + b.dataset.tab; b.setAttribute('aria-controls', 'view'); const on = b.getAttribute('aria-selected') === 'true'; if (on) sel = b; b.tabIndex = on ? 0 : -1; });

document.addEventListener('keydown', (ev) => {
  const t = ev.target; if (!t.matches || !t.matches('#tabs [role=tab]')) return;
  const tabs = $$('#tabs [role=tab]').filter((b) => !b.hidden), i = tabs.indexOf(t), n = tabs.length, k = ev.key;
  const j = k === 'ArrowRight' || k === 'ArrowDown' ? (i + 1) % n : k === 'ArrowLeft' || k === 'ArrowUp' ? (i - 1 + n) % n : k === 'Home' ? 0 : k === 'End' ? n - 1 : -1;
  if (j < 0) return; ev.preventDefault(); const tab = tabs[j].dataset.tab; tabs[j].click();
  const f = $(`#tabs [data-tab="${tab}"]`); if (f) { f.focus(); f.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});
new MutationObserver(tabsA11y).observe($('#tabs'), { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-selected'] });
tabsA11y();
